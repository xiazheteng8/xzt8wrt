name: 汇总最新成功固件
on:
  repository_dispatch:
    types: [firmware-ready]
  workflow_dispatch:
    inputs:
      source_run:
        description: '构建运行编号'
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  # Coalesce pending notifications; each run reads ALL ready artifacts from the source run.
  group: xzt8wrt-release-snapshot
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 核对原构建
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.event.client_payload.run_id || inputs.source_run }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run=os.environ['SOURCE_RUN']
          if not re.fullmatch(r'[0-9]+',run): raise ValueError('运行编号无效')
          repo=os.environ['GH_REPO']
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
          if data['head_repository']['full_name']!=repo or data['head_branch']!='main' or data['path']!='.github/workflows/build.yml':
              raise ValueError('仅允许本仓库 main 分支固件构建')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.client_payload.run_id || inputs.source_run }}
          pattern: xzt8wrt-[0-9]*
          path: release-input
      - name: 校验、打包并汇总最新成功固件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.event.client_payload.run_id || inputs.source_run }}
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils
          python3 release-support.py legacy release-input "$SOURCE_RUN"
          python3 build-support.py bundle --input release-input --output release-output
          python3 vm-images.py release-input release-output
          python3 aggregate.py release-output
