name: Build xzt8wrt
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Version (Filogic supports lite only)'
        type: choice
        default: both
        options: [both, full, lite]
      platform:
        description: 'Platform group'
        type: choice
        default: all
        options: [all, x86, rockchip, filogic]
      configure_only:
        description: 'Only validate targets and packages (no firmware)'
        type: boolean
        default: false
  schedule:
    # Sunday 03:00 Asia/Shanghai = Saturday 19:00 UTC.
    - cron: '0 19 * * 6'
permissions:
  contents: read
concurrency:
  group: xzt8wrt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      ref: ${{ steps.source.outputs.ref }}
      commit: ${{ steps.source.outputs.commit }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest official stable release and build matrix
        id: source
        env:
          SELECT_PLATFORM: ${{ inputs.platform || 'all' }}
          SELECT_PROFILE: ${{ inputs.profile || 'both' }}
        run: |
          python3 test-build-support.py
          python3 build-support.py resolve > source.json
          python3 - <<'PY'
          import json, os
          source = json.load(open('source.json'))
          combinations = [('x86','full'), ('x86','lite'), ('rockchip','full'), ('rockchip','lite'), ('filogic','lite')]
          jobs = [{'platform': p, 'profile': v} for p,v in combinations
                  if os.environ['SELECT_PLATFORM'] in ('all', p)
                  and os.environ['SELECT_PROFILE'] in ('both', v)]
          if not jobs:
              raise SystemExit('No supported combination. Filogic supports lite only.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in source.items():
                  out.write(f'{key}={value}\n')
              out.write('matrix=' + json.dumps({'include': jobs}) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Official stable: {source['ref']}\n\nSource commit: {source['commit']}\n\n")
              out.write('Targets: ' + ', '.join(f"{j['platform']}/{j['profile']}" for j in jobs))
          PY
  firmware:
    needs: prepare
    name: ${{ matrix.platform }}-${{ matrix.profile }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h .
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl patch diffutils tar xz-utils zstd libelf-dev
      - name: Build or validate firmware configuration
        run: bash build.sh
        env:
          JOBS: '2'
          PLATFORM: ${{ matrix.platform }}
          PROFILE: ${{ matrix.profile }}
          SOURCE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REF: ${{ needs.prepare.outputs.ref }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          PREPARE_ONLY: ${{ inputs.configure_only && '1' || '0' }}
      - name: Upload firmware and configuration
        if: ${{ success() && !inputs.configure_only }}
        uses: actions/upload-artifact@v4
        with:
          name: xzt8wrt-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.profile }}
          path: artifacts/${{ matrix.platform }}-${{ matrix.profile }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics or configuration validation
        if: ${{ !cancelled() && (failure() || inputs.configure_only) }}
        uses: actions/upload-artifact@v4
        with:
          name: xzt8wrt-diagnostics-${{ matrix.platform }}-${{ matrix.profile }}
          path: |
            source.json
            requested.config
            immortalwrt/.config
            immortalwrt/source.json
            immortalwrt/logs/
          include-hidden-files: true
