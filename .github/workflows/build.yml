name: Build xzt8wrt
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Version (Filogic supports lite only)'
        type: choice
        default: both
        options: [both, full, lite]
      platform:
        description: 'Platform group'
        type: choice
        default: all
        options: [all, x86, rockchip, filogic, custom]
      device:
        description: 'ARM only: exact target/subtarget/device from the website (platform=custom)'
        type: string
        default: ''
      version:
        description: 'Official stable version or latest'
        type: string
        default: latest
      configure_only:
        description: 'Only validate targets and packages (no firmware)'
        type: boolean
        default: false
  schedule:
    # Sunday 03:00 Asia/Shanghai = Saturday 19:00 UTC.
    - cron: '0 19 * * 6'
permissions:
  contents: read
concurrency:
  group: xzt8wrt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      ref: ${{ steps.source.outputs.ref }}
      commit: ${{ steps.source.outputs.commit }}
      matrix: ${{ steps.source.outputs.matrix }}
      has_updates: ${{ steps.source.outputs.has_updates }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest official stable release and build matrix
        id: source
        env:
          SELECT_PLATFORM: ${{ inputs.platform || 'all' }}
          SELECT_PROFILE: ${{ inputs.profile || 'both' }}
          SELECT_DEVICE: ${{ inputs.device }}
          SELECT_VERSION: ${{ inputs.version || 'latest' }}
          SCHEDULED_CHECK: ${{ github.event_name == 'schedule' && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 test-build-support.py
          node test-setup-wizard.js
          python3 test-firmware-overlay.py
          mkdir -p baseline
          python3 release-support.py baseline > baseline/kernel-state.json
          python3 build-support.py resolve --version "$SELECT_VERSION" > source.json
          python3 - <<'PY'
          import json, os
          source = json.load(open('source.json'))
          import importlib.util
          spec = importlib.util.spec_from_file_location('support', 'build-support.py')
          support = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(support)
          baseline = json.load(open('baseline/kernel-state.json'))
          kernels = {p: support.kernel_source(p, source['version']) for p in support.TARGETS}
          if os.environ['SELECT_PLATFORM'] == 'custom':
              device = os.environ['SELECT_DEVICE']
              selected, group = support.arm_selection(device)
              profile = os.environ['SELECT_PROFILE']
              profiles = (['full', 'lite'] if selected['full'] else ['lite']) if profile == 'both' else [profile]
              for p in profiles:
                  support.config('custom', p, device)
              kernel = support.kernel_source('custom', source['version'], device)
              jobs = [{'platform': 'custom', 'profile': p, 'device': device, 'kernel': kernel} for p in profiles]
              skipped = []
          else:
              if os.environ['SELECT_DEVICE']:
                  raise ValueError('device must be empty unless platform=custom')
              jobs, skipped = support.build_plan(os.environ['SELECT_PLATFORM'], os.environ['SELECT_PROFILE'],
                                                os.environ['SCHEDULED_CHECK'] == '1', baseline, kernels)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in source.items():
                  out.write(f'{key}={value}\n')
              out.write('has_updates=' + ('true' if jobs else 'false') + '\n')
              out.write('matrix=' + json.dumps({'include': jobs or [{'platform': 'x86', 'profile': 'lite', 'kernel': kernels['x86']}]}) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Official stable: {source['ref']}\n\nSource commit: {source['commit']}\n\n")
              out.write('Build targets: ' + (', '.join(f"{j['platform']}/{j['profile']}" for j in jobs) or 'none') + '\n\n')
              out.write('Unchanged kernels, skipped: ' + (', '.join(skipped) or 'none'))
          PY
  firmware:
    needs: prepare
    if: needs.prepare.outputs.has_updates == 'true'
    name: ${{ matrix.platform }}-${{ matrix.profile }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h .
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl patch diffutils tar xz-utils zstd libelf-dev cmake ninja-build
      - name: Build or validate firmware configuration
        run: bash build.sh
        env:
          JOBS: '2'
          PLATFORM: ${{ matrix.platform }}
          PROFILE: ${{ matrix.profile }}
          DEVICE: ${{ matrix.device || '' }}
          SOURCE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REF: ${{ needs.prepare.outputs.ref }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          SOURCE_KERNEL: ${{ toJSON(matrix.kernel) }}
          PREPARE_ONLY: ${{ inputs.configure_only && '1' || '0' }}
      - name: Upload firmware and configuration
        if: ${{ success() && !inputs.configure_only }}
        uses: actions/upload-artifact@v4
        with:
          name: xzt8wrt-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.profile }}
          path: artifacts/${{ matrix.platform }}-${{ matrix.profile }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Notify immediate publication of completed firmware
        if: ${{ success() && !inputs.configure_only && matrix.platform != 'custom' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.run_id }}
        run: gh api "repos/$GH_REPO/dispatches" --method POST -f event_type=firmware-ready -f "client_payload[run_id]=$SOURCE_RUN"
      - name: Upload diagnostics or configuration validation
        if: ${{ !cancelled() && (failure() || inputs.configure_only) }}
        uses: actions/upload-artifact@v4
        with:
          name: xzt8wrt-diagnostics-${{ matrix.platform }}-${{ matrix.profile }}
          path: |
            source.json
            requested.config
            immortalwrt/.config
            immortalwrt/source.json
            immortalwrt/arm-adaptation.json
            immortalwrt/arm-adaptation.diff
            immortalwrt/logs/
          include-hidden-files: true
