name: Build xzt8wrt
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        default: both
        options: [both, full, lite]
  schedule:
    # Sunday 03:00 Asia/Shanghai = Saturday 19:00 UTC.
    - cron: '0 19 * * 6'
permissions:
  contents: read
concurrency:
  group: xzt8wrt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  firmware:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.profile != 'both' && format('["{0}"]', inputs.profile) || '["full","lite"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h .
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl patch diffutils tar xz-utils zstd libelf-dev
      - name: Build firmware
        run: bash build.sh
        env:
          JOBS: '2'
          PROFILE: ${{ matrix.profile }}
      - name: Upload firmware and configuration
        uses: actions/upload-artifact@v4
        with:
          name: xzt8wrt-25.12.2-x86-64-${{ matrix.profile }}
          path: artifacts/${{ matrix.profile }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xzt8wrt-build-diagnostics-${{ matrix.profile }}
          path: |
            immortalwrt/.config
            immortalwrt/logs/
          include-hidden-files: true
